{% extends 'base.html' %}

{% block extra_style %}
<style>
    /* === Delete Page Styling === */
    .delete-container {
        max-width: 500px;
        margin: 80px auto;
        background: var(--card-bg);
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: var(--shadow);
        text-align: center;
        color: var(--text);
    }

    .delete-container h2 {
        color: var(--primary);
        margin-bottom: 20px;
        font-weight: 600;
    }

    .delete-container p {
        font-size: 17px;
        color: #555;
        margin-bottom: 30px;
    }

    .delete-container form {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .delete-container button,
    .delete-container a {
        padding: 10px 22px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
    }

    .delete-container button {
        background-color: #e74c3c;
        color: white;
        border: none;
        transition: 0.3s;
    }

    .delete-container button:hover {
        background-color: #c0392b;
    }

    .delete-container a {
        background-color: #ecf0f1;
        color: #333;
        border: 1px solid #ddd;
    }

    .delete-container a:hover {
        background-color: #e0e0e0;
    }
</style>
{% endblock %}

{% block content %}
<div class="delete-container">
    <h2>Delete Expense</h2>
    <p>Are you sure you want to delete <strong>"{{ object.title }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'expense-list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
